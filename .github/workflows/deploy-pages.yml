name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configure deployment
        id: deploy-config
        run: |
          if [ "${{ github.repository }}" = "pranavgupta21/cosell" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "ga_measurement_id=G-ZTHHNW701J" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/cosell-staging/" >> "$GITHUB_OUTPUT"
            echo "ga_measurement_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.deploy-config.outputs.base_path }}
          VITE_GA_MEASUREMENT_ID: ${{ steps.deploy-config.outputs.ga_measurement_id }}

      - name: Add SPA fallback
        run: cp dist/public/index.html dist/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
